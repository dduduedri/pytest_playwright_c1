[pytest]
testpaths = tests
addopts = --html=reports-results/report.html --self-contained-html --alluredir=reports-results/allure-results

# stream log records to the console live as tests run (see utils/logger.py)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
markers =
    smoke: quick smoke tests for critical flows
    full: full end-to-end regression tests
    ui: UI (browser) tests
    api: API tests
    e2e: combined API + UI end-to-end tests
    regression: full regression suite
